{{ define "main" }}
<section class="running-page" data-running-url="{{ "running/data.json" | relURL }}">
  <div class="running-hero">
    <p class="running-kicker">RUN LOG</p>
    <h1>Running</h1>
    <p id="running-lifetime" class="running-lead">正在读取跑步记录……</p>
    <p class="running-privacy">
      数据来自 Apple Health 的本地导出，不关联或展示 Strava 账号。
      路线已移除时间和海拔、抽稀坐标，并默认裁掉起点和终点各约 500 米。
    </p>
  </div>

  <div id="running-error" class="running-error" hidden></div>

  <div class="running-toolbar">
    <label for="running-year">年份</label>
    <select id="running-year" aria-label="选择跑步年份"></select>
    <span id="running-updated" class="running-updated"></span>
  </div>

  <div id="running-stats" class="running-stats" aria-live="polite"></div>

  <div class="running-grid">
    <section class="running-panel running-panel-wide">
      <div class="running-panel-heading">
        <div>
          <p class="running-panel-label">CONSISTENCY</p>
          <h2 id="running-heatmap-title">跑步热力图</h2>
        </div>
        <div class="running-legend" aria-label="热力图图例">
          <span>少</span><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><span>多</span>
        </div>
      </div>
      <div id="running-heatmap" class="running-heatmap" aria-label="每日跑步距离"></div>
    </section>

    <section class="running-panel">
      <p class="running-panel-label">MONTHLY DISTANCE</p>
      <h2>月跑量</h2>
      <div id="running-monthly" class="running-monthly" aria-label="每月跑步距离"></div>
    </section>
  </div>

  <section class="running-panel running-map-panel">
    <div class="running-panel-heading running-map-heading">
      <div>
        <p class="running-panel-label">PRIVACY-TRIMMED ROUTES</p>
        <h2>路线地图</h2>
      </div>
      <select id="running-route-select" aria-label="选择路线"></select>
    </div>
    <p id="running-route-summary" class="running-route-summary">正在读取路线……</p>
    <div id="running-map" class="running-map" aria-label="跑步路线地图"></div>
  </section>

  <section class="running-panel running-log-panel">
    <div class="running-panel-heading">
      <div>
        <p class="running-panel-label">ACTIVITY LOG</p>
        <h2>跑步记录</h2>
      </div>
      <button id="running-toggle" class="running-toggle" type="button" hidden>显示全部</button>
    </div>
    <div class="running-table-wrap">
      <table class="running-table">
        <thead>
          <tr><th>日期</th><th>距离</th><th>时长</th><th>配速</th><th>平均心率</th></tr>
        </thead>
        <tbody id="running-activities"></tbody>
      </table>
    </div>
  </section>

  <p class="running-credit">
    页面设计灵感来自 <a href="https://github.com/yihong0618/running_page">running_page</a>。
  </p>

  <noscript>这个页面需要 JavaScript 来显示跑步统计。</noscript>
</section>
{{ end }}
