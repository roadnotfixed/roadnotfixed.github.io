{{ define "main" }}
<section class="running-page" data-running-url="{{ "running/data.json" | relURL }}">
  <div class="running-headline">
    <div class="running-hero">
      <p class="running-kicker">PERSONAL RUNNING ARCHIVE</p>
      <h1>Running Page</h1>
      <p id="running-lifetime" class="running-lead">正在读取跑步记录……</p>
    </div>
    <div class="running-year-nav">
      <div id="running-years" class="running-years" aria-label="选择跑步年份"></div>
      <span id="running-updated" class="running-updated"></span>
    </div>
  </div>

  <div id="running-error" class="running-error" hidden></div>

  <div class="running-primary">
    <aside class="running-summary" aria-live="polite">
      <div class="running-summary-title">
        <strong id="running-summary-year">—</strong>
        <span>Journey</span>
      </div>
      <div id="running-stats" class="running-stats"></div>
    </aside>

    <div class="running-main-column">
      <div class="running-secondary">
        <section class="running-data-section running-heatmap-section">
          <div class="running-section-heading">
            <div>
              <p class="running-panel-label">CONSISTENCY</p>
              <h2 id="running-heatmap-title">跑步热力图</h2>
            </div>
            <div class="running-legend" aria-label="热力图图例">
              <span>少</span><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><span>多</span>
            </div>
          </div>
          <div id="running-heatmap" class="running-heatmap" aria-label="每日跑步距离"></div>
        </section>

        <section class="running-data-section running-monthly-section">
          <p class="running-panel-label">MONTHLY DISTANCE</p>
          <h2>月跑量</h2>
          <div id="running-monthly" class="running-monthly" aria-label="每月跑步距离"></div>
        </section>
      </div>

      <section class="running-map-stage">
        <div class="running-section-heading running-map-heading">
          <div>
            <p class="running-panel-label">ROUTES</p>
            <h2>跑步路线</h2>
          </div>
          <select id="running-route-select" aria-label="选择路线"></select>
        </div>
        <p id="running-route-summary" class="running-route-summary">正在读取路线……</p>
        <div id="running-map" class="running-map" aria-label="跑步路线地图"></div>
      </section>

      <section class="running-log-panel">
        <div class="running-section-heading">
          <div>
            <p class="running-panel-label">ACTIVITY LOG</p>
            <h2>跑步记录</h2>
          </div>
          <label class="running-log-limit" for="running-limit">
            显示
            <select id="running-limit">
              <option value="10" selected>10</option>
              <option value="50">50</option>
              <option value="all">全部</option>
            </select>
          </label>
        </div>
        <div class="running-table-wrap">
          <table class="running-table">
            <thead>
              <tr><th>KM</th><th>PACE</th><th>BPM</th><th>TIME</th><th>DATE</th></tr>
            </thead>
            <tbody id="running-activities"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <p class="running-credit">
    页面设计灵感来自 <a href="https://github.com/yihong0618/running_page">running_page</a>。
  </p>

  <noscript>这个页面需要 JavaScript 来显示跑步统计。</noscript>
</section>
{{ end }}
